# Default Python lint/format settings for greenfield repositories; adopt the repository's own when one exists.
line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[format]
quote-style = "double"
